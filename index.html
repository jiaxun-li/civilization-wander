<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="从一个人物、信仰或政治实体出发，沿着经过策展的关联连续阅读人类文明。">
  <meta name="theme-color" content="#f1ede3">
  <title>文明漫游 · 连续阅读文明知识网络</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles/v3/cards.css">
  <link rel="stylesheet" href="styles/v3/map.css">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="site-brand" href="#home" data-home-link aria-label="文明漫游首页">
        <span class="site-brand__mark" aria-hidden="true">游</span>
        <span>
          <strong data-brand-name>文明漫游</strong>
          <small data-brand-tagline>沿着关联漫游人类文明</small>
        </span>
      </a>
      <nav class="reading-path" aria-label="当前阅读路径">
        <span>阅读路径</span>
        <ol id="reading-path-list">
          <li aria-current="page">首页</li>
        </ol>
      </nav>
    </header>

    <main>
      <section id="home-view" class="home-view" aria-labelledby="home-title">
        <div class="home-hero">
          <p class="home-hero__eyebrow">连续阅读 · 连续点击</p>
          <h1 id="home-title" tabindex="-1">从一个人物、信仰或政治实体出发。</h1>
          <p class="home-hero__lead">向下滚动阅读一张 Card；点击经过策展的关联，进入下一张 Card。地图只负责安静地补充空间背景。</p>
          <a class="home-primary-action" href="#card/buddhism-overview/buddhism-origins"
            data-start-card="buddhism-overview">从佛教开始阅读 <span aria-hidden="true">→</span></a>
        </div>
        <section class="home-entities" aria-labelledby="home-entities-title">
          <header>
            <p class="home-hero__eyebrow">第一批文明实体</p>
            <h2 id="home-entities-title">四个入口，一张相互连接的网络</h2>
          </header>
          <div id="home-card-grid" class="home-card-grid"></div>
        </section>
        <aside class="home-method">
          <p>地图范围、路线与节点为明确标注的近似教学表达；它们呈现历史发生的空间条件，不主张地理决定历史结果。</p>
        </aside>
      </section>

      <section id="card-view" class="card-view" hidden>
        <div id="card-root" role="region" aria-label="当前文明 Card"></div>
      </section>
    </main>
  </div>

  <noscript>此原型需要 JavaScript 来激活连续 Scene、地图状态和 Card 导航。</noscript>

  <script src="data/world-physical.js"></script>
  <script src="data/v3/atlas-data.js"></script>
  <script src="data/v3/queries.js"></script>
  <script src="ui/v3/cards.js"></script>
  <script src="ui/v3/card-reader.js"></script>
  <script src="assets/natural-earth/base.js"></script>
  <script src="map/v3/map-renderer.js"></script>
  <script src="app.js"></script>
</body>
</html>
