<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="从一个故事出发，走进彼此相连的历史。一个人物、一座城市、一件器物或一部作品，都承载着具体的时代与生活。">
  <meta name="theme-color" content="#f1ede3">
  <title>文明漫游 · 连续阅读文明知识网络</title>
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="site-brand" href="#home" data-home-link aria-label="文明漫游首页">
        <span class="site-brand__mark" aria-hidden="true">游</span>
        <span>
          <strong data-brand-name>文明漫游</strong>
          <small data-brand-tagline>沿着关联漫游人类文明</small>
        </span>
      </a>
    </header>

    <main>
      <section id="home-view" class="home-view" aria-labelledby="home-title">
        <div class="home-hero">
          <p class="home-hero__eyebrow">历史的线索</p>
          <h1 id="home-title" tabindex="-1">从一个故事出发，走进彼此相连的历史。</h1>
          <p class="home-hero__lead">一个人物、一座城市、一件器物或一部作品，都承载着具体的时代与生活。</p>
          <nav class="home-primary-actions" aria-label="推荐阅读起点">
            <a class="home-primary-action" href="#card/sumer-measuring-land-time/sumer-water-network"
              data-home-primary-action data-start-card="sumer-measuring-land-time">从苏美尔开始 <span aria-hidden="true">→</span></a>
            <a class="home-primary-action" href="#card/odyssey-name-and-home/odyssey-return-songs-become-poem"
              data-start-card="odyssey-name-and-home">从《奥德赛》开始 <span aria-hidden="true">→</span></a>
            <a class="home-primary-action" href="#card/egypt-pyramids-kingdom-at-work/egypt-pyramid-stone-grows"
              data-start-card="egypt-pyramids-kingdom-at-work">从金字塔开始 <span aria-hidden="true">→</span></a>
          </nav>
        </div>
        <div id="home-sections" data-home-sections></div>
      </section>

      <section id="card-view" class="card-view" hidden>
        <div class="story-back-bar" data-story-back-bar hidden>
          <button class="story-back" type="button" data-story-back>
            <span aria-hidden="true">←</span>
            <span class="story-back__desktop" data-story-back-desktop>返回上一个故事</span>
            <span class="story-back__mobile" data-story-back-mobile>返回</span>
          </button>
          <p class="story-trail" data-story-trail hidden aria-label="漫游足迹"></p>
        </div>
        <div id="card-root" role="region" aria-label="当前历史故事"></div>
      </section>
    </main>
  </div>

  <noscript>此原型需要 JavaScript 来激活连续阅读、可选地图和故事导航。</noscript>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
