<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="以地形机制解释中国历史的交互式区域地理原型。">
  <title>山河与历史 · 原型</title>
  <style>
:root {
  color-scheme: light dark;
  --bg: #f5f2e9;
  --panel: rgba(255, 253, 247, 0.96);
  --panel-2: #ebe5d7;
  --text: #20231f;
  --muted: #666b63;
  --border: rgba(62, 66, 59, 0.20);
  --accent: #9c4d2d;
  --accent-2: #2e6670;
  --warn: #7a5b18;
  --shadow: 0 18px 48px rgba(40, 44, 38, 0.14);
}

* { box-sizing: border-box; }
html { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
body { margin: 0; background: var(--bg); color: var(--text); }
button, a { font: inherit; }
button { cursor: pointer; }

.app-shell {
  min-height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr;
}

.topbar {
  display: flex;
  justify-content: space-between;
  gap: 24px;
  align-items: center;
  padding: 18px 24px;
  border-bottom: 1px solid var(--border);
  background: rgba(245, 242, 233, 0.93);
  backdrop-filter: blur(14px);
  position: sticky;
  top: 0;
  z-index: 20;
}

.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent); color: white; font-size: 20px;
}
.brand h1 { margin: 0; font-size: 19px; font-weight: 700; }
.brand p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.top-note { max-width: 420px; font-size: 13px; color: var(--muted); text-align: right; }

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(360px, 0.8fr);
  min-height: 0;
}

.map-column {
  padding: 20px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.story-tabs { display: flex; gap: 9px; flex-wrap: wrap; }
.story-tab {
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  border-radius: 999px;
  padding: 9px 13px;
  transition: 160ms ease;
}
.story-tab:hover { transform: translateY(-1px); }
.story-tab[aria-selected="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

.map-frame {
  position: relative;
  flex: 1;
  min-height: 520px;
  border: 1px solid var(--border);
  border-radius: 22px;
  overflow: hidden;
  background: #8da0a8;
  box-shadow: var(--shadow);
}
.map-frame svg { width: 100%; height: 100%; display: block; background: #8da0a8; }
.map-image { image-rendering: auto; }
.map-overlay { pointer-events: none; }
.map-caption {
  position: absolute;
  left: 14px; right: 14px; bottom: 12px;
  padding: 10px 12px;
  border-radius: 12px;
  background: rgba(28, 34, 31, 0.78);
  color: rgba(255,255,255,0.92);
  font-size: 12px;
  backdrop-filter: blur(6px);
}

.feature-label {
  font-size: 18px;
  font-weight: 650;
  paint-order: stroke;
  stroke: rgba(249, 246, 236, 0.94);
  stroke-width: 5px;
  stroke-linejoin: round;
  fill: #18211f;
}
.feature-subtle { fill: rgba(156,77,45,0.12); stroke: var(--accent); stroke-width: 3; stroke-dasharray: 7 5; }
.feature-place { fill: var(--accent); stroke: white; stroke-width: 4; }
.feature-gate { fill: #f0c15b; stroke: #4c3a14; stroke-width: 3; }
.feature-ridge { fill: none; stroke: #533e35; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 12 8; }
.feature-river { fill: none; stroke: #2f708a; stroke-width: 7; stroke-linecap: round; }
.feature-corridor { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 3 12; }

.reading-column {
  border-left: 1px solid var(--border);
  background: var(--panel);
  padding: 28px 30px 48px;
  overflow-y: auto;
}
.eyebrow { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.story-title { font-family: Georgia, "Songti SC", serif; font-size: clamp(28px, 4vw, 42px); line-height: 1.14; margin: 10px 0 14px; }
.thesis { font-size: 18px; line-height: 1.65; margin: 0; }
.meta-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 26px; }
.badge { border-radius: 999px; padding: 6px 9px; font-size: 12px; background: var(--panel-2); color: var(--muted); }
.section { padding: 21px 0; border-top: 1px solid var(--border); }
.section h2 { font-size: 17px; margin: 0 0 11px; }
.section p { margin: 9px 0; line-height: 1.75; color: #363b35; }
.takeaway { padding: 16px 18px; border-left: 5px solid var(--accent); background: rgba(156,77,45,0.08); border-radius: 0 12px 12px 0; line-height: 1.65; }
.caveat { padding: 16px 18px; border: 1px solid rgba(122,91,24,0.25); background: rgba(192,151,55,0.08); border-radius: 12px; line-height: 1.65; }
.sources { display: grid; gap: 8px; }
.sources a { color: var(--accent-2); line-height: 1.4; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.footer-note { margin-top: 24px; font-size: 12px; color: var(--muted); line-height: 1.6; }

@media (max-width: 920px) {
  .topbar { align-items: flex-start; }
  .top-note { display: none; }
  .layout { grid-template-columns: 1fr; }
  .map-frame { min-height: 430px; }
  .reading-column { border-left: 0; border-top: 1px solid var(--border); overflow: visible; }
}

@media (max-width: 520px) {
  .topbar, .map-column, .reading-column { padding-left: 15px; padding-right: 15px; }
  .map-frame { min-height: 370px; border-radius: 16px; }
  .feature-label { font-size: 22px; }
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171a18;
    --panel: rgba(31, 35, 32, 0.97);
    --panel-2: #2c312d;
    --text: #f0eee7;
    --muted: #b2b5ae;
    --border: rgba(235, 238, 230, 0.14);
    --accent: #d9825f;
    --accent-2: #87c4cc;
    --shadow: 0 18px 48px rgba(0, 0, 0, 0.30);
  }
  .topbar { background: rgba(23,26,24,0.92); }
  .section p { color: #d4d6d0; }
  .feature-label { fill: #111713; stroke: rgba(249, 246, 236, 0.90); }
}

</style>
</head>

  <script>
(() => {
  const MAP = { width: 1440, height: 840, lonMin: 80, lonMax: 122, latMin: 20, latMax: 45 };
  const stories = window.ATLAS_STORIES || [];
  const tabs = document.getElementById('story-tabs');
  const svg = document.getElementById('atlas-map');
  const overlay = document.getElementById('map-overlay');
  const mapCaption = document.getElementById('map-caption');
  const article = document.getElementById('story-content');

  function xy(lon, lat) {
    return {
      x: ((lon - MAP.lonMin) / (MAP.lonMax - MAP.lonMin)) * MAP.width,
      y: ((MAP.latMax - lat) / (MAP.latMax - MAP.latMin)) * MAP.height
    };
  }

  function viewBox(view) {
    const topLeft = xy(view.lonMin, view.latMax);
    const bottomRight = xy(view.lonMax, view.latMin);
    return `${topLeft.x} ${topLeft.y} ${bottomRight.x - topLeft.x} ${bottomRight.y - topLeft.y}`;
  }

  function svgEl(name, attrs = {}) {
    const node = document.createElementNS('http://www.w3.org/2000/svg', name);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
    return node;
  }

  function label(text, x, y, anchor = 'start') {
    const t = svgEl('text', { x, y, class: 'feature-label', 'text-anchor': anchor });
    t.textContent = text;
    return t;
  }

  function renderFeature(feature) {
    if (feature.type === 'area') {
      const p = xy(feature.lon, feature.lat);
      const pxX = (feature.rx / (MAP.lonMax - MAP.lonMin)) * MAP.width;
      const pxY = (feature.ry / (MAP.latMax - MAP.latMin)) * MAP.height;
      overlay.appendChild(svgEl('ellipse', { cx: p.x, cy: p.y, rx: pxX, ry: pxY, class: 'feature-subtle' }));
      overlay.appendChild(label(feature.label, p.x, p.y - pxY - 12, 'middle'));
      return;
    }

    if (['ridge', 'river', 'corridor'].includes(feature.type)) {
      const pts = feature.points.map(([lon, lat]) => xy(lon, lat));
      const d = pts.map((p, index) => `${index === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
      overlay.appendChild(svgEl('path', { d, class: `feature-${feature.type}` }));
      const mid = pts[Math.floor(pts.length / 2)];
      overlay.appendChild(label(feature.label, mid.x, mid.y - 14, 'middle'));
      return;
    }

    const p = xy(feature.lon, feature.lat);
    const className = feature.type === 'gate' ? 'feature-gate' : 'feature-place';
    const radius = feature.type === 'gate' ? 11 : 8;
    overlay.appendChild(svgEl('circle', { cx: p.x, cy: p.y, r: radius, class: className }));
    overlay.appendChild(label(feature.label, p.x + 16, p.y - 13));
  }

  function renderArticle(story) {
    const sections = story.sections.map(section => `
      <section class="section">
        <h2>${section.heading}</h2>
        ${section.body.map(paragraph => `<p>${paragraph}</p>`).join('')}
      </section>
    `).join('');

    article.innerHTML = `
      <div class="eyebrow">${story.eyebrow}</div>
      <h1 class="story-title">${story.title}</h1>
      <p class="thesis">${story.thesis}</p>
      <div class="meta-row">
        <span class="badge">解释信心：${story.confidence}</span>
        <span class="badge">内容状态：人工策展初稿</span>
      </div>
      ${sections}
      <section class="section">
        <h2>一句话带走</h2>
        <div class="takeaway">${story.takeaway}</div>
      </section>
      <section class="section">
        <h2>避免地理决定论</h2>
        <div class="caveat">${story.caveat}</div>
      </section>
      <section class="section">
        <h2>参考来源</h2>
        <div class="sources">
          ${story.sources.map(source => `<a href="${source.url}" target="_blank" rel="noreferrer">${source.title}</a>`).join('')}
        </div>
      </section>
      <p class="footer-note">这是内容验证版，不是最终学术结论。下一版应逐条增加脚注、史料争议和不同学者解释。</p>
    `;
  }

  function selectStory(id) {
    const story = stories.find(item => item.id === id) || stories[0];
    if (!story) return;

    tabs.querySelectorAll('button').forEach(button => {
      button.setAttribute('aria-selected', String(button.dataset.story === story.id));
    });

    overlay.innerHTML = '';
    story.features.forEach(renderFeature);
    svg.setAttribute('viewBox', viewBox(story.view));
    mapCaption.textContent = story.mapNote;
    renderArticle(story);
    history.replaceState(null, '', `#${story.id}`);
  }

  stories.forEach((story, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'story-tab';
    button.dataset.story = story.id;
    button.setAttribute('role', 'tab');
    button.setAttribute('aria-selected', index === 0 ? 'true' : 'false');
    button.textContent = story.title.replace('为什么', '').replace('？', '');
    button.addEventListener('click', () => selectStory(story.id));
    tabs.appendChild(button);
  });

  const initial = location.hash.slice(1);
  selectStory(stories.some(story => story.id === initial) ? initial : stories[0]?.id);
})();

</script>
