<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="以地图和时间轴探索地理、文明与思想如何共同塑造世界。">
  <title>山河与文明 · 互动文明图谱</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">山</div>
        <div>
          <h1>山河与文明</h1>
          <p>为什么历史会在这个地方以这种方式展开？</p>
        </div>
      </div>
      <nav class="site-nav" aria-label="主要导航">
        <a href="#home" data-route-link="home">首页</a>
        <a href="#map" data-route-link="map">地图</a>
        <a href="#explorations" data-route-link="explorations">探索</a>
      </nav>
    </header>

    <main class="layout">
      <section class="map-column" aria-label="交互地图">
        <nav id="story-tabs" class="story-tabs" aria-label="图集导航"></nav>
        <section id="mobile-context-lead" class="mobile-context-lead" hidden aria-live="polite"></section>
        <div class="map-frame">
          <svg id="atlas-map" viewBox="0 0 1440 840" preserveAspectRatio="none" role="img" aria-label="可缩放拖动并切换底图的自然地理地图">
            <g id="tile-layer" class="tile-layer"></g>
            <g id="vector-layer" class="vector-layer"></g>
            <g id="map-overlay" class="map-overlay"></g>
          </svg>
          <div id="map-ui-overlay" class="map-ui-overlay" aria-label="地图地点节点"></div>
          <div id="world-map-tools" class="world-map-tools" hidden>
            <div class="map-mode-switch" role="group" aria-label="选择地图底图">
              <button type="button" data-world-style="satellite" aria-pressed="true">卫星</button>
              <button type="button" data-world-style="vector" aria-pressed="false">地理简图</button>
            </div>
            <div id="map-view-actions" class="world-map-actions">
              <button id="zoom-world-out" type="button" aria-label="缩小世界地图">−</button>
              <output id="world-zoom-level" aria-live="polite">1×</output>
              <button id="zoom-world-in" type="button" aria-label="放大世界地图">＋</button>
              <button id="reset-world-map" type="button">重置</button>
            </div>
          </div>
          <div id="map-caption" class="map-caption"></div>
          <aside id="entity-preview-card" class="entity-preview-card" hidden aria-live="polite"></aside>
        </div>
        <section id="entity-timeline" class="entity-timeline" hidden aria-label="实体时间轴"></section>
      </section>

      <article id="story-content" class="reading-column" aria-live="polite"></article>
    </main>
  </div>
  <script src="data/world-physical.js"></script>
  <script src="data/region-hydro.js"></script>
  <script src="data/content.js"></script>
  <script src="data/knowledge.js"></script>
  <script src="data/curation.js"></script>
  <script src="data/entity-network.js"></script>
  <script src="data/entity-queries.js"></script>
  <script src="app.js"></script>
</body>
</html>
